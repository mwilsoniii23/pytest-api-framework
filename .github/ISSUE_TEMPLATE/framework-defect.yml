name: Framework Defect
description: Something in this framework is wrong
labels: ["bug:framework"]
body:
  - type: textarea
    id: what
    attributes:
      label: What's wrong
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      render: bash
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: introduced
    attributes:
      label: Introduced in
      placeholder: "commit sha or PR number, if known"