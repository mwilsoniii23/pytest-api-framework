name: Enhancement
description: A capability the framework should have but doesn't
labels: ["enhancement"]
body:
  - type: textarea
    id: gap
    attributes:
      label: The gap
      description: What can't the framework do today?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it matters
      description: What goes wrong in practice without it?
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: Proposed approach
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How will you know it's done? Name the tests.